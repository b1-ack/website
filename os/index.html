<html>
<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme:dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme:light)">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://b1ack.net">
    <link rel="preconnect" href="https://github.com">
    <meta name="author" content="B1ack">
    <meta name="keywords" content="B1ackOS, GNU/Linux, operating system, linux distro, free software">
    <meta name="description" content="B1ackOS GNU/Linux - information and download">
    <meta property="og:title" content="B1ackOS">
    <meta property="og:description" content="Information and download of B1ackOS system.">
    <meta property="og:image" content="https://b1ack.net/img/b1ack-cinnamon.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="675">
    <meta property="og:url" content="https://os.b1ack.net/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="B1ackOS">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@B1ackOS">
    <link rel="alternate" hreflang="en" href="https://os.b1ack.net/en">
    <link rel="alternate" hreflang="ru" href="https://os.b1ack.net/ru">
    <link rel="alternate" hreflang="de" href="https://os.b1ack.net/de">
    <link rel="alternate" hreflang="fr" href="https://os.b1ack.net/fr">
    <link rel="alternate" hreflang="ka" href="https://os.b1ack.net/ge">
    <link rel="alternate" hreflang="x-default" href="https://os.b1ack.net/">
    
    <script>
        (function() {
            const savedLang = localStorage.getItem('b1ack-lang');
            const userLang = (navigator.language || navigator.userLanguage).toLowerCase().split('-')[0];
            let targetPath = '/en';
            const langMap = { 'de': '/de', 'fr': '/fr', 'ka': '/ge', 'ge': '/ge', 'ru': '/ru' };
            if (savedLang && langMap[savedLang]) targetPath = langMap[savedLang];
            else if (langMap[userLang]) targetPath = langMap[userLang];
            window.location.replace(targetPath);
        })();
    </script>
</head>
</html>
